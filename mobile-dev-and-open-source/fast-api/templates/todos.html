<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TODO List</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;

      max-width: 70svw;
      margin-left: auto;
      margin-right: auto;

      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      padding: 1rem 0;
    }

    table {
      width: 100%;
      border: 1px solid black;
      border-collapse: collapse;
    }

    td,
    th {
      border: 1px solid black;
      padding: .2rem .4rem;
    }
  </style>
</head>

<body>
  <h1>TODO List</h1>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
      </tr>
    </thead>
    <tbody>
      {% for todo in todos %}
      <tr>
        <td>{{todo.id}}</td>
        <td>{{todo.name}}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

</body>

</html>
