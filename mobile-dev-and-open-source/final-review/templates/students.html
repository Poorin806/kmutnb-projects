<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;

      max-width: 70svw;
      margin-left: auto;
      margin-right: auto;

      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      padding: 1rem 0;
    }

    main {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    table {
      width: 100%;
      border: 1px solid black;
      border-collapse: collapse;
    }

    td,
    th {
      border: 1px solid black;
      padding: 0.2rem 0.4rem;
    }

    .button {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .button-primary {
      background-color: #4caf50;
      color: white;
    }

    .button-primary:hover {
      background-color: #45a049;
    }

    .button-danger {
      background-color: #f44336;
      color: white;
    }

    .button-danger:hover {
      background-color: #da190b;
    }

    .button-secondary {
      background-color: #008cba;
      color: white;
    }

    .button-secondary:hover {
      background-color: #007bb5;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
  </style>
</head>

<body>

  <main>

    <a href="/students/add">
      <button class="button button-primary">Add Student</button>
    </a>

    <table>
      <thead>
        <th>Student ID</th>
        <th>Name</th>
        <th>Division</th>
        <th>Action</th>
      </thead>
      <tbody>
        {% for row in students %}
        <tr>
          <td>{{ row.student_id }}</td>
          <td>{{ row.name }}</td>
          <td>{{ row.division }}</td>
          <td>
            <a href="/students/{{ row.student_id }}/edit">
              <button class="button button-secondary">Edit</button>
            </a>
            <button class="button button-danger" onclick="deleteStudent('{{ row.student_id }}')">Delete</button>
          </td>

        </tr>
        {% endfor %}
      </tbody>
    </table>

  </main>

  <script>

    async function deleteStudent(studentId) {

      const isConfirm = confirm("Are you sure you want to delete this student?");
      if (!isConfirm) return;

      const response = await fetch(`/api/students/${studentId}`, {
        method: 'DELETE'
      });

      if (response.ok) {
        // If the deletion was successful, reload the page to reflect changes
        alert('Student deleted successfully.');
        window.location.reload();
      } else {
        alert('Failed to delete student.');
      }
    }

  </script>

</body>

</html>
